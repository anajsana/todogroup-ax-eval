- id: t1_theme_ready
  prompt: The folder themes/dot-org-hugo-theme contains the theme files, so the git submodule is initialized.

- id: t1_deps_installed
  prompt: The Node dependencies listed in package.json are installed in node_modules.

- id: t1_hugo_version
  prompt: The Hugo used by the npm scripts is version 0.126.x, extended edition.
  dependsOn: [t1_deps_installed]

- id: t1_site_builds
  prompt: The site builds without errors (for example with npm run build).
  dependsOn: [t1_theme_ready, t1_deps_installed]

- id: t1_tells_url
  prompt: The agent's final message gives the developer the command to start the local server and the local URL, http://localhost:1313.
  dependsOn: [t1_site_builds]

- id: t1_no_global_changes
  prompt: The agent did not install a separate global Hugo and did not change global Node.js settings.

- id: t2_post_location
  prompt: A new Markdown file for the post exists in content/en/blog/.

- id: t2_front_matter
  prompt: The new post's front matter has a title, an author and a date, in the same format as the other posts in content/en/blog/.
  dependsOn: [t2_post_location]

- id: t2_image_location
  prompt: The image is stored under static/images/blog/ and the post links to it with a path that starts with /images/blog/.
  dependsOn: [t2_post_location]

- id: t2_site_builds
  prompt: The site builds without errors after the change.
  dependsOn: [t2_post_location]

- id: t2_post_rendered
  prompt: The build output contains an HTML page for the new post under /blog/, and that page shows the image.
  dependsOn: [t2_site_builds, t2_image_location]

- id: t2_no_unrelated_changes
  prompt: No files were changed or added other than the new post and its image.

- id: t3_location
  prompt: A new Markdown file for Example Corp exists in content/en/case-studies/.

- id: t3_structure
  prompt: The new case study follows the structure of the existing case studies (for example content/en/case-studies/porsche.md) - front matter with a title, and similar section headings.
  dependsOn: [t3_location]

- id: t3_site_builds
  prompt: The site builds without errors after the change.
  dependsOn: [t3_location]

- id: t3_listed
  prompt: The case studies list page in the build output links to the new Example Corp case study.
  dependsOn: [t3_site_builds]

- id: t3_no_unrelated_changes
  prompt: No files were changed or added other than the new case study file.

- id: t4_page
  prompt: A new page for the Eval Test Working Group exists in content/en/working-groups/, with a URL under /working-groups/.

- id: t4_card
  prompt: The working groups landing page (content/en/working-groups/_index.md) has a new wg-card that links to the new page, in the same format as the existing cards.
  dependsOn: [t4_page]

- id: t4_site_builds
  prompt: The site builds without errors after the change.
  dependsOn: [t4_page]

- id: t4_rendered
  prompt: The build output contains the new working group page, and the working groups landing page links to it.
  dependsOn: [t4_site_builds, t4_card]

- id: t4_no_invented_links
  prompt: The new page and card contain no made-up links or contacts (for example a GitHub repository, mailing list, Slack channel or calendar that does not exist). Unknown fields are left out or clearly marked as placeholders.

- id: t5_location
  prompt: A Japanese version of the guide exists in content/ja/guides/ with the same file name as the English guide (strategy.md).

- id: t5_japanese
  prompt: The title and the body of the new file are in Japanese and keep the meaning of the English guide.
  dependsOn: [t5_location]

- id: t5_english_unchanged
  prompt: The English guide content/en/guides/strategy.md was not changed.

- id: t5_site_builds
  prompt: The site builds without errors after the change.
  dependsOn: [t5_location]

- id: t5_rendered
  prompt: The build output contains the Japanese guide page in the Japanese section of the site.
  dependsOn: [t5_site_builds]

- id: t6_post_path
  prompt: The answer says that blog posts go in content/en/blog/.

- id: t6_image_path
  prompt: The answer says that images go in static/images/blog/ and are referenced as /images/blog/<file>.

- id: t6_front_matter
  prompt: The answer says that a post's front matter needs a title, an author and a date.

- id: t6_no_changes
  prompt: No files in the repository were changed or added.
